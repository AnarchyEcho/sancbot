# DO NOT CHANGE THE VERSION MANUALLY
version: 11
# Most commands, when executed, have a small colored line
# next to the response. The color depends whether the command
# is completed, errored or in progress (pending)
# Color settings below are for the color of those lines.
# To get color's hex, you can go here https://htmlcolorcodes.com/
# and copy the hex code fo your selected color (marked as #)
color:
  # Color used for embed responses when command successfully executes
  ok: 00e584
  # Color used for embed responses when command has an error
  error: ee281f
  # Color used for embed responses while command is doing work or is in progress
  pending: faa61a
# Default bot language. It has to be in the list of supported languages (.langli)
defaultLocale: en-US
# Style in which executed commands will show up in the logs.
# Allowed values: Simple, Normal, None
consoleOutputType: Normal
# Whether the bot will check for new releases every hour
checkForUpdates: true
# List of owner IDs who have opted out of receiving forwarded DMs.
# By default, all owners receive forwarded DMs. Use .fw command to opt out.
forwardOptOutOwnerIds: []
# Any messages sent by users in Bot's DM will be forwarded to the specified channel.
# When set, this overrides individual owner DM forwarding.
forwardToChannel: 
# Should the bot ignore messages from other bots?
# Settings this to false might get your bot banned if it gets into a spam loop with another bot.
# This will only affect command executions, other features will still block bots from access.
# Default true
ignoreOtherBots: true
# When a user DMs the bot with a message which is not a command
# they will receive this message. Leave empty for no response. The string which will be sent whenever someone DMs the bot.
# Supports embeds. How it looks: https://puu.sh/B0BLV.png
dmHelpText: |-
  {"description": "Type `%prefix%h` for help."}
# Only users who send a DM to the bot containing one of the specified words will get a DmHelpText response.
# Case insensitive.
# Leave empty to reply with DmHelpText to every DM.
dmHelpTextKeywords:
  - help
  - commands
  - cmds
  - module
  - can you do
# This is the response for the .h command
helpText: |-
  # 📜 SERVER GUIDE & INFORMATION

  Welcome to the server! Below you'll find everything you need to know about our economy, bot commands, booster perks, community voting, and server features.

  ## 🍪 ECONOMY

  Earn cookies 🍪 **by chatting**, using `!work`, fishing in <#1543834544099164171> (check pins), gambling in <#757552954596261888>, or winning events! Spend them in the `!shop` for custom roles, perks, or Nitro. You can check your cookie 🍪 balance by using `!bal`.

  ## 💎 BOOSTING & VIP

  Boosting unlocks better audio quality, larger file uploads, exclusive server perks for you, and the possibility for the server to rent game servers!

  ✨ **VIP Perks:**
  • Access to exclusive colors in <#758192874503274497>
  • **+50 bonus 🍪** daily
  • **+50% extra 🍪** from `!work`

  *(Buying the 💳 VIP role in `!shop` awards these same benefits!)*

  ## 🗳️ VOTING & DEMOCRACY

  Help shape the server! Vote on ideas in <#1195432098715152485> and discuss them in <#1195432501833912361>. Grab the voter role in <#879490219785732117> if you would like to be pinged for votes. Voting requires you to have been fully verified *(Which you become once you hit Level 2. You can check your level with (`!xp`)*.

  ## ❓ FREQUENTLY ASKED QUESTIONS

  ❓ **Why can't I share links, post images, or join VC?**
  > You must reach **Level 2** (seen with `!xp`) to receive the **Verified Fur!** role which unlocks media/VC access. Artists can open a ticket in <#1079547118018117686> for early verification to advertise.

  ❓ **How do I sell a shop role?**
  > Type `!sell <shop_number>` (e.g., `!sell 3`) in <#757552954596261888> for a **75% refund**.
  > `!Fishshop` items are non-refundable.

  <@766443756903596043> is a modded version of NadekoBot, whose commands you can find below (we use `!` as a command prefix, not `.` ) :
  https://nadeko.bot/commands
# List of modules and commands completely blocked on the bot
blocked:
  commands: []
  modules: []
# List of modules and commands blocked from usage in DMs on the bot
dmBlocked:
  commands: []
  modules: []
# Which string will be used to recognize the commands
prefix: .
# Whether the bot will rotate through all specified statuses.
# This setting can be changed via .ropl command.
# See RotatingStatuses submodule in Administration.
rotateStatuses: true
